<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — UPPA GSM</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo .icon { font-size: 3rem; }
    .login-logo h1 { font-size: 1.4rem; font-weight: 700; margin-top: 0.5rem; color: #7c8cf8; }
    .login-logo p  { font-size: 0.85rem; color: #64748b; margin-top: 0.3rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.4rem; }
    .form-input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    .form-input:focus { outline: none; border-color: #7c8cf8; }
    .btn-login {
      width: 100%;
      background: #7c8cf8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #6470e0; }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .footer-info {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">
      <div class="icon">📡</div>
      <h1>UPPA GSM Alertes</h1>
      <p>Surveillance température — LFCR</p>
    </div>

    {% if form.errors %}
    <div class="error">
      Identifiant ou mot de passe incorrect.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Identifiant</label>
        <input type="text" name="username" class="form-input" placeholder="uppaadmin" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login">Se connecter</button>
    </form>

    <div class="footer-info">
      BTS CIEL — Projet UPPA LFCR — Session 2025
    </div>
  </div>
</body>
</html>
